name: home-server

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    restart: always
    ports:
      - "2283:2283"
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false
    networks:
      - immich-net

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    restart: always
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    healthcheck:
      disable: false
    networks:
      - immich-net

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:42cba146593a5ea9a622002c1b7cba5da7be248650cbb64ecb9c6c33d29794b1
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - immich-net

  database:
    container_name: immich_postgres
    # Immich v3 dropped pgvecto.rs. This image provides VectorChord plus the
    # pgvector and pgvecto.rs compatibility layers needed for the migration.
    # See https://docs.immich.app/install/upgrading#migrating-to-vectorchord
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if the database is stored on spinning disks
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - immich-net

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    user: "${JELLYFIN_UID}:${JELLYFIN_GID}"
    network_mode: host
    volumes:
      - ${JELLYFIN_CONFIG_DIR}:/etc/jellyfin
      - ${JELLYFIN_CACHE_DIR}:/var/cache/jellyfin
      - ${JELLYFIN_DATA_DIR}:/var/lib/jellyfin
      - ${JELLYFIN_LOG_DIR}:/var/log/jellyfin
      - ${JELLYFIN_MOVIES_SOURCE}:${JELLYFIN_MOVIES_TARGET}:ro
      - ${JELLYFIN_MUSIC_SOURCE}:${JELLYFIN_MUSIC_TARGET}:ro
    environment:
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_SERVER_URL}
      - JELLYFIN_CONFIG_DIR=/etc/jellyfin
      - JELLYFIN_CACHE_DIR=/var/cache/jellyfin
      - JELLYFIN_DATA_DIR=/var/lib/jellyfin
      - JELLYFIN_LOG_DIR=/var/log/jellyfin

  piper:
    container_name: piper
    image: lscr.io/linuxserver/piper:latest
    restart: unless-stopped
    ports:
      - "10200:10200"
    volumes:
      - piper-data:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PIPER_VOICE=${PIPER_VOICE}

  faster-whisper:
    container_name: faster-whisper
    image: lscr.io/linuxserver/faster-whisper:latest
    restart: unless-stopped
    ports:
      - "10300:10300"
    volumes:
      - faster-whisper-data:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WHISPER_BEAM=${WHISPER_BEAM}
      - WHISPER_LANG=${WHISPER_LANG}
      - WHISPER_MODEL=${WHISPER_MODEL}

volumes:
  model-cache:
  piper-data:
  faster-whisper-data:

networks:
  immich-net:
    driver: bridge
